name: PassVault CI/CD Pipeline (Free Cloud Deployment)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Trigger deployment manually'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# Automatically cancels old in-progress runs when you push a new commit to save free GitHub minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Continuous Integration (CI): Frontend Lint, Tests & Production Vite Bundle
  # ============================================================================
  test-frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Lint (oxlint)
        working-directory: ./frontend
        run: npm run lint

      - name: Run Frontend Unit & Crypto Tests (Vitest)
        working-directory: ./frontend
        run: npm test

      - name: Build Frontend Application Bundle (Vite)
        working-directory: ./frontend
        run: npm run build

  # ============================================================================
  # Continuous Integration (CI): Backend Integration & Security Tests
  # ============================================================================
  test-backend:
    name: Backend Test & Verification
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Integration & Isolation Tests (Jest)
        working-directory: ./backend
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_for_ci_pipeline_at_least_32_chars!
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/passvault_ci_test

  # ============================================================================
  # Continuous Deployment (CD): Automated 100% Free Cloud Deployment (Render)
  # ============================================================================
  deploy:
    name: Deploy to Free Cloud (Render & Atlas)
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    # Deploy only on push to main or manual workflow dispatch
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Trigger Free Render Backend Deployment
        run: |
          echo "=========================================================="
          echo "🚀 Triggering Automated Zero-Cost Cloud Deployment"
          echo "=========================================================="
          
          # Deploy Backend Web Service via webhook
          if [ -n "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" ]; then
            echo "📡 Sending deploy signal to Render Backend..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}")
            echo "Render Backend response: HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
              echo "✅ Backend deployment triggered successfully on Render!"
            else
              echo "⚠️ Unexpected response from Render Backend webhook: HTTP $HTTP_STATUS"
            fi
          else
            echo "ℹ️ Secret RENDER_BACKEND_DEPLOY_HOOK is not set yet. Skipping backend webhook."
          fi

          # Deploy Frontend Static Site (Optional, if hosting frontend on Render)
          if [ -n "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" ]; then
            echo "📡 Sending deploy signal to Render Frontend..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}")
            echo "Render Frontend response: HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
              echo "✅ Frontend deployment triggered successfully on Render!"
            fi
          else
            echo "ℹ️ Secret RENDER_FRONTEND_DEPLOY_HOOK not configured (or handled by Vercel auto-git deploy)."
          fi

          echo "=========================================================="
          echo "🎉 All CI checks passed & cloud deploy hook executed for $GITHUB_SHA!"
          echo "=========================================================="
